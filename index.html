<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>ARUN KATHARE • Colour Live</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Inter',sans-serif
            }

            body {
                background: #08080a;
                color: #fff;
                min-height: 100vh;
                position: relative;
                overflow-x: hidden
            }

            .bg {
                position: fixed;
                inset: 0;
                background: radial-gradient(700px 400px at 15% 10%, rgba(124,77,255,.22), transparent), radial-gradient(600px 500px at 85% 85%, rgba(0,210,106,.18), transparent), radial-gradient(500px 400px at 50% 40%, rgba(255,80,80,.12), transparent)
            }

            .nav {
                position: relative;
                z-index: 2;
                display: flex;
                justify-content: space-between;
                padding: 16px 20px;
                align-items: center
            }

            .logo {
                font-weight: 900;
                font-size: 15px;
                letter-spacing: -.5px
            }

            .logo em {
                font-style: normal;
                color: #7c4dff
            }

            .pill {
                border: 1px solid rgba(255,255,255,.12);
                background: rgba(255,255,255,.06);
                backdrop-filter: blur(12px);
                padding: 6px 12px;
                border-radius: 100px;
                font-size: 10px;
                font-weight: 700
            }

            .hero {
                position: relative;
                z-index: 2;
                text-align: center;
                padding: 10px 24px 0
            }

            .orbs {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin: 22px 0
            }

            .o {
                width: 72px;
                height: 72px;
                border-radius: 50%;
                position: relative
            }

            .o::after {
                content: '';
                position: absolute;
                inset: 8px;
                background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), transparent 45%);
                border-radius: 50%
            }

            .r {
                background: radial-gradient(circle at 35% 35%, #ff8a80, #d32f2f);
                box-shadow: 0 0 40px rgba(211,47,47,.6);
                animation: f 3s infinite
            }

            .g {
                background: radial-gradient(circle at 35% 35%, #a5d6a7, #2e7d32);
                box-shadow: 0 0 40px rgba(46,125,50,.6);
                animation: f 3s .25s infinite
            }

            .v {
                background: radial-gradient(circle at 35% 35%, #b39ddb, #512da8);
                box-shadow: 0 0 40px rgba(81,45,168,.6);
                animation: f 3s .5s infinite
            }

            @keyframes f {
                0%,100% {
                    transform: translateY(0) scale(1)
                }

                50% {
                    transform: translateY(-12px) scale(1.08)
                }
            }

            .hero h1 {
                font-size: 38px;
                font-weight: 900;
                line-height: .9;
                letter-spacing: -1.2px
            }

            .hero h1 span {
                background: linear-gradient(90deg,#ff7a7a,#7aff9a,#a88cff);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent
            }

            .hero p {
                color: #777;
                font-size: 14px;
                margin: 12px auto;
                max-width: 260px
            }

            .card {
                position: relative;
                z-index: 2;
                margin: 24px 16px;
                background: rgba(18,18,20,.88);
                backdrop-filter: blur(24px);
                border: 1px solid rgba(255,255,255,.08);
                border-radius: 26px;
                padding: 22px;
                box-shadow: 0 24px 60px rgba(0,0,0,.6)
            }

            .head {
                display: flex;
                align-items: center;
                gap: 14px
            }

            .tg {
                width: 56px;
                height: 56px;
                background: linear-gradient(135deg,#2AABEE,#1c8fca);
                border-radius: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 26px;
                box-shadow: 0 10px 24px rgba(42,171,238,.4)
            }

            .meta b {
                font-size: 17px;
                font-weight: 800;
                display: block
            }

            .meta span {
                font-size: 12px;
                color: #666
            }

            .live {
                margin-left: auto;
                background: #0e2212;
                border: 1px solid #1e4d2a;
                color: #00e676;
                font-size: 10px;
                font-weight: 800;
                padding: 7px 12px;
                border-radius: 100px;
                display: flex;
                align-items: center;
                gap: 6px
            }

            .dot {
                width: 7px;
                height: 7px;
                background: #00e676;
                border-radius: 50%;
                box-shadow: 0 0 10px #00e676;
                animation: pp 1.2s infinite
            }

            @keyframes pp {
                0%,100% {
                    opacity: 1;
                    transform: scale(1)
                }

                50% {
                    opacity: .6;
                    transform: scale(1.4)
                }
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
                margin: 18px 0
            }

            .box {
                background: rgba(255,255,255,.03);
                border: 1px solid rgba(255,255,255,.06);
                border-radius: 16px;
                padding: 14px;
                text-align: center
            }

            .box b {
                font-size: 17px;
                display: block
            }

            .box i {
                font-style: normal;
                font-size: 10px;
                color: #666;
                text-transform: uppercase;
                letter-spacing: .6px
            }

            .btn {
                width: 100%;
                background: #fff;
                color: #000;
                border: 0;
                padding: 18px;
                border-radius: 18px;
                font-weight: 900;
                font-size: 17px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                box-shadow: 0 12px 30px rgba(255,255,255,.18);
                transition: .2s
            }

            .btn:active {
                transform: scale(.97)
            }

            .ar {
                width: 30px;
                height: 30px;
                background: #000;
                color: #fff;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .foot {
                text-align: center;
                margin: 12px 0 0;
                font-size: 11px;
                color: #555;
                display: flex;
                justify-content: center;
                gap: 12px
            }

            .badgeName {
                background: linear-gradient(135deg,#7c4dff,#5e35b1);
                padding: 4px 10px;
                border-radius: 100px;
                font-size: 10px;
                font-weight: 800;
                letter-spacing: .5px;
                margin-left: 6px
            }
        </style>
    </head>
    <body>
        <div class="bg"></div>
        <div class="nav">
            <div class="logo">
                ARUN<em>•</em>
                KATHARE <span class="badgeName">OFFICIAL</span>
            </div>
            <div class="pill">21+ ONLY</div>
        </div>
        <div class="hero">
            <div class="orbs">
                <div class="o r"></div>
                <div class="o g"></div>
                <div class="o v"></div>
            </div>
            <h1>
                ARUN<br>
                <span>KATHARE Live</span>
            </h1>
            <p>Private results circle. Instant updates, no spam.</p>
        </div>
        <div class="card">
            <div class="head">
                <div class="tg">AK</div>
                <div class="meta">
                    <b>ARUN KATHARE</b>
                    <span>Official Channel • Invite Only</span>
                </div>
                <div class="live">
                    <div class="dot"></div>
                    LIVE
                </div>
            </div>
            <div class="grid">
                <div class="box">
                    <b>1.2s</b>
                    <i>Speed</i>
                </div>
                <div class="box">
                    <b>24/7</b>
                    <i>Active</i>
                </div>
                <div class="box">
                    <b>Private</b>
                    <i>Circle</i>
                </div>
            </div>
            <button class="btn" onclick="location.href='join.html'">
                Join ARUN's Channel <div class="ar">→</div>
            </button>
            <div class="foot">
                <span>⚡ Instant</span>
                <span>•</span>
                <span>🔒 Private</span>
                <span>•</span>
                <span>✓ Free</span>
            </div>
        </div>
        <div style="position:relative;z-index:2;text-align:center;padding:10px 0 30px;font-size:10px;color:#333">Play responsibly. 21+ only. Risk involved.</div>
    </body>
</html>
